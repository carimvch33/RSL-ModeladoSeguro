name: Publicar AsciiDoc en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Ruby y Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby
          sudo gem install asciidoctor rouge

      - name: Compilar AsciiDoc a HTML
        run: |
          mkdir -p public
          asciidoctor -a source-highlighter=rouge -a icons=font index.adoc -o public/index.html
          if [ -d "images" ]; then cp -r images public/; fi

      - name: Desplegar a rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
