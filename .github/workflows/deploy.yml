name: Publicar AsciiDoc en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Ruby y Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby
          sudo gem install asciidoctor rouge

      - name: Compilar AsciiDoc a HTML
        run: |
          mkdir -p dist
          asciidoctor -a source-highlighter=rouge -a icons=font index.adoc -o dist/index.html
          if [ -d "images" ]; then cp -r images dist/; fi

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
